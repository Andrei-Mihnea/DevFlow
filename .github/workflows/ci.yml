name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, build, and tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore DevFlow.slnx

      - name: Verify whitespace formatting
        run: dotnet format whitespace DevFlow.slnx --verify-no-changes --no-restore

      - name: Verify code style
        run: dotnet format style DevFlow.slnx --verify-no-changes --no-restore --severity info

      - name: Build
        run: dotnet build DevFlow.slnx --configuration Release --no-restore

      - name: Run unit tests with coverage
        run: >
          dotnet test DevFlow.slnx
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Upload test results and coverage
        uses: actions/upload-artifact@v6
        with:
          name: test-results-and-coverage
          path: artifacts/test-results
          if-no-files-found: error

  dependency-security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore DevFlow.slnx

      - name: Check vulnerable dependencies
        shell: bash
        run: |
          mkdir -p artifacts/security

          dotnet package list --project DevFlow.slnx  \
            --include-transitive \
            --vulnerable \
            --format json \
            > artifacts/security/dependency-vulnerabilities.json

          if jq -e '
            [
              (.projects // [])[]
              | (.frameworks // [])[]
              | (
                  ((.topLevelPackages // [])[]),
                  ((.transitivePackages // [])[])
                )
              | select((.vulnerabilities // []) | length > 0)
            ]
            | length == 0
          ' artifacts/security/dependency-vulnerabilities.json > /dev/null; then
            echo "No vulnerable dependencies found."
          else
            echo "Vulnerable dependencies found."
            exit 1
          fi

      - name: Upload dependency audit
        uses: actions/upload-artifact@v6
        with:
          name: dependency-vulnerability-audit
          path: artifacts/security/dependency-vulnerabilities.json
          if-no-files-found: error

  secret-security:
    name: Secret scan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auth-api-container:
    name: Auth API container security
    needs: quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build Auth API image
        run: >
          docker build
          --file DevFlow.Auth.Api/Dockerfile
          --tag devflow/auth-api:${{ github.sha }}
          .

      - name: Scan Auth API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devflow/auth-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL