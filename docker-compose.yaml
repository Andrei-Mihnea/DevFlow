services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db
    ports:
      - "1522:1521"  ## host/computer port: container port
    environment:
      ORACLE_PASSWORD: UltraSecurePassword123!
      APP_USER: devuser
      APP_USER_PASSWORD: DevPassword123!
      
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 5s
    volumes:
        - oracle-data:/opt/oracle/oradata
    
volumes:
    oracle-data: